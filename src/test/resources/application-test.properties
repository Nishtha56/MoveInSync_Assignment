spring.application.name=smart-desk-booking-test

# In-memory H2 with PostgreSQL compatibility mode for isolated fast unit/integration tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Smart Desk Test Rules
smartdesk.booking.grace-period-minutes=30
smartdesk.booking.cancellation-cutoff-hours=2
smartdesk.scheduler.no-show-rate-ms=600000
